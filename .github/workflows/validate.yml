name: Validate lists

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate domain lists
        run: python3 tools/validate_lists.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
