name: Missing entry
description: A domain is blocked (or blocks Iran) but is not in the lists.
title: "[Missing entry] "
labels: ["data", "missing-entry"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      description: The exact domain that is missing.
      placeholder: example.com
    validations:
      required: true
  - type: dropdown
    id: list
    attributes:
      label: Which list should it be in?
      options:
        - list.txt (blocked in Iran)
        - blocked-from-outside.txt (Iran-hosted)
        - blocked-by-sanctions.txt (services blocking Iran)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What did you test (site, page, DNS, HTTPS) and what did you observe — block page, timeout, geo-block message, HTTP status?
      placeholder: "From Tehran the site shows the Iranian filtering block page; from Germany it loads fine…"
    validations:
      required: true
  - type: input
    id: tested_from
    attributes:
      label: Tested from
      description: Country and, if inside Iran, the ISP or network.
      placeholder: "Iran — Shatel Mobile"
    validations:
      required: true
  - type: input
    id: date_tested
    attributes:
      label: Date tested
      placeholder: "2026-11-20"
    validations:
      required: true
